# Generated by ai-project-init. Project-specific values may be edited after initialization.

schema_version = 3

[project]
name = "CodeLensPro"
product = "CodeLens Pro"
timezone = "Asia/Shanghai"
default_language = "zh-CN"
backend_java_version = "21"


[documents]
formal_product_spec = ""
management_console_startup_guide = ""
database_baselines = []
database_migrations = ""
database_seeds = ""

[tools]
local_config_section = "tools"
required = ["git_home", "node_home", "python_home", "jdk21_home", "jdk25_home", "maven_home", "gradle_home"]

# Requires JDK 21, Gradle, and a local IntelliJ IDEA installation.
# Set CODELENS_PRO_IDE_PATH or append -PlocalIdePath="<IDE installation>".
# Gradle Wrapper 9.7.0 is also available; commands below use local Gradle.
[commands.test]
working_directory = "."
command = "gradle test"
[commands.check]
working_directory = "."
command = "gradle check"
[commands.build]
working_directory = "."
command = "gradle buildPlugin"
[commands.start]
working_directory = "."
command = "gradle runIde"
[resources]
local_config = ".ai/project.local.toml"
local_config_example = ".ai/project.local.example.toml"
local_config_contains_plaintext_secrets = true
never_commit_local_config = true

[resources.policy]
undeclared_resource_access = "deny"
write_requires_explicit_authorization = true
non_development_requires_explicit_authorization = true




